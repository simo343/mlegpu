<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .word{fill:#0b1220}.tag{fill:#5b6475}
    @media (prefers-color-scheme: dark){.word{fill:#e6edf3}.tag{fill:#9aa4b2}}
  </style>
  <defs>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="18%" stop-color="#ffd166"/>
      <stop offset="45%" stop-color="#f77f00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f77f00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track" gradientUnits="userSpaceOnUse" x1="38" y1="158" x2="160" y2="44">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#b5179e"/>
    </linearGradient>
    <clipPath id="tile"><rect x="20" y="20" width="160" height="160" rx="32"/></clipPath>
  </defs>

  <!-- icon tile -->
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#0b1220" stroke="#2a3a5a" stroke-width="1.5"/>
  <g clip-path="url(#tile)">
    <!-- camera pixel grid -->
    <g stroke="#1c2a44" stroke-width="1">
      <path d="M20 52H180M20 84H180M20 116H180M20 148H180M52 20V180M84 20V180M116 20V180M148 20V180"/>
    </g>
    <!-- convex cost landscape: nested level sets around one global minimum -->
    <g fill="none" stroke="url(#track)" transform="rotate(-35 100 100)">
      <ellipse cx="100" cy="100" rx="92" ry="58" stroke-opacity="0.25" stroke-width="1.5"/>
      <ellipse cx="100" cy="100" rx="70" ry="44" stroke-opacity="0.35" stroke-width="1.5"/>
      <ellipse cx="100" cy="100" rx="50" ry="31" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>
    <!-- LM iterates converging to the minimum -->
    <path d="M120.0 168.0 L119.2 166.8 L118.1 165.3 L116.9 163.5 L115.5 161.3 L113.8 158.7 L111.8 155.7 L109.6 152.1 L107.2 148.1 L104.7 143.6 L102.2 138.7 L99.7 133.5 L97.6 128.2 L95.9 123.0 L94.9 118.1 L94.5 113.6 L94.8 109.8 L95.5 106.8 L96.5 104.4 L97.6 102.7 L98.5 101.5 L99.2 100.8 L99.6 100.4 L100.0 100.0" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="3 3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="url(#track)">
      <circle cx="120.0" cy="168.0" r="4.5"/>
      <circle cx="109.6" cy="152.1" r="3.6"/>
      <circle cx="94.5" cy="113.6" r="2.8"/>
    </g>
    <!-- PSF of the current molecule: spot with diffraction rings -->
    <circle cx="100" cy="100" r="40" fill="url(#spot)"/>
    <circle cx="100" cy="100" r="27" fill="none" stroke="#ffd166" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="100" cy="100" r="38" fill="none" stroke="#ffd166" stroke-opacity="0.18" stroke-width="2"/>
    <!-- fitted position -->
    <g stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <path d="M100 82V92M100 108V118M82 100H92M108 100H118"/>
    </g>
    <circle cx="100" cy="100" r="2.5" fill="#ffffff"/>
  </g>

  <!-- wordmark -->
  <text x="208" y="118" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" letter-spacing="-1">
    <tspan class="word" font-weight="700">mle</tspan><tspan fill="#f77f00" font-weight="600">gpu</tspan>
  </text>
  <text x="211" y="150" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" class="tag" letter-spacing="0.5">
    3D single-molecule localization · JAX
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
